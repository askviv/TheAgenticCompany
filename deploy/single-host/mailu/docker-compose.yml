# Based on the Mailu 2024.06.58 Compose setup template.
# Keep this single shared Mailu instance; do not attach experiment-specific volumes.
name: theagentcompany-mailu

services:
  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    labels:
      tac.environment: single-host
    volumes:
      - /data/theagentcompany/mailu/redis:/data
    dns:
      - 9.9.9.9
      - 1.1.1.1
    networks:
      - default

  front:
    image: ghcr.io/mailu/nginx:2024.06.58@sha256:78fb2f9dbc3081e4fa251bd16b589d06a48ebd428b64daed16a483c8db899288
    healthcheck:
      test: ["CMD", "curl", "-m3", "-skfLo", "/dev/null", "http://127.0.0.1:10204/health"]
    restart: unless-stopped
    labels:
      tac.environment: single-host
    env_file: /data/theagentcompany/mailu/mailu.env
    ports:
      # Caddy keeps host port 443. Caddy can proxy to this loopback-only HTTP port.
      - "127.0.0.1:8112:80"
      # LAN-bound ports for local SMTP delivery and authenticated submission/IMAP.
      - "192.0.2.10:2525:25"
      - "192.0.2.10:2587:587"
      - "192.0.2.10:2993:993"
    volumes:
      - /data/theagentcompany/https-tls:/certs:ro
      - /data/theagentcompany/mailu/overrides/nginx:/overrides:ro
    dns:
      - 9.9.9.9
      - 1.1.1.1
    networks:
      - default
      - webmail

  admin:
    image: ghcr.io/mailu/admin:2024.06.58@sha256:6d10f83d3a5afa41f7b40945563531a069ec99927a6fab9fdeed5e0ab229fbd3
    restart: unless-stopped
    labels:
      tac.environment: single-host
    env_file: /data/theagentcompany/mailu/mailu.env
    volumes:
      - /data/theagentcompany/mailu/data:/data
      - /data/theagentcompany/mailu/dkim:/dkim
    depends_on:
      - redis
    dns:
      - 9.9.9.9
      - 1.1.1.1
    networks:
      - default

  imap:
    image: ghcr.io/mailu/dovecot:2024.06.58@sha256:a03363ef7c041b28058044452d2235b1519ec7c733bbe64da662250ded298053
    restart: unless-stopped
    labels:
      tac.environment: single-host
    env_file: /data/theagentcompany/mailu/mailu.env
    volumes:
      - /data/theagentcompany/mailu/mail:/mail
      - /data/theagentcompany/mailu/overrides/dovecot:/overrides:ro
    depends_on:
      - front
    dns:
      - 9.9.9.9
      - 1.1.1.1
    networks:
      - default

  smtp:
    image: ghcr.io/mailu/postfix:2024.06.58@sha256:a3b9518773dd5c339150a53241ec445f7061d0b4b831741eb845c2034ea7b80d
    restart: unless-stopped
    labels:
      tac.environment: single-host
    env_file: /data/theagentcompany/mailu/mailu.env
    volumes:
      - /data/theagentcompany/mailu/mailqueue:/queue
      - /data/theagentcompany/mailu/overrides/postfix:/overrides:ro
    depends_on:
      - front
    dns:
      - 9.9.9.9
      - 1.1.1.1
    networks:
      - default

  antispam:
    image: ghcr.io/mailu/rspamd:2024.06.58@sha256:b89dd13cb02dcb5ca94ed9fde1440bb621ba0b1bc0ad1de0fdcd4abf4b3578eb
    hostname: antispam
    restart: unless-stopped
    labels:
      tac.environment: single-host
    env_file: /data/theagentcompany/mailu/mailu.env
    volumes:
      - /data/theagentcompany/mailu/filter:/var/lib/rspamd
      - /data/theagentcompany/mailu/overrides/rspamd:/overrides:ro
    depends_on:
      - front
      - redis
    dns:
      - 9.9.9.9
      - 1.1.1.1
    networks:
      - default

  webmail:
    image: theagentcompany/mailu-webmail:2024.06.58-tac1
    build:
      context: ./webmail
    restart: unless-stopped
    labels:
      tac.environment: single-host
    env_file: /data/theagentcompany/mailu/mailu.env
    volumes:
      - /data/theagentcompany/mailu/webmail:/data
      - /data/theagentcompany/mailu/overrides/roundcube:/overrides:ro
    depends_on:
      - front
    networks:
      - webmail

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/24
  webmail:
    driver: bridge
