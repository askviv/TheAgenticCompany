# Cua Driver 0.38.0 bounded desktop profile for one employee-owned Selkies container.
# Run the MCP process inside that container so X11 actions cannot reach another desktop.
version: 3

allow:
  tools:
    - start_session
    - end_session
    - list_apps
    - list_windows
    - get_window_state
    - get_desktop_state
    - get_screen_size
    - get_cursor_position
    - move_cursor
    - click
    - double_click
    - right_click
    - drag
    - scroll
    - type_text
    - press_key
    - hotkey
    - set_agent_cursor_enabled
    - get_agent_cursor_state

resources:
  desktop:
    display: true
