<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Provider Portal</title>
  <style>
    :root{font:16px/1.5 system-ui,sans-serif;color:#192432;background:#f5f7fa}body{margin:0}main{max-width:920px;margin:3rem auto;padding:0 1rem}section,article{background:#fff;border:1px solid #dce3ea;border-radius:12px;padding:1.25rem;margin:1rem 0}label{display:block;margin:.75rem 0 .25rem}input,textarea,button{font:inherit;padding:.65rem;border:1px solid #bac6d2;border-radius:6px}input,textarea{width:100%;box-sizing:border-box}textarea{min-height:7rem}button{background:#154b75;color:white;border:0;cursor:pointer;margin-top:.75rem}button.secondary{background:#526579}button:disabled{opacity:.6}small,.muted{color:#596b7d}.row{display:flex;gap:.6rem;align-items:center}.row button{margin-left:auto}.message{white-space:pre-wrap;border-top:1px solid #e2e8ef;padding:.75rem 0}.reply{margin-left:1rem}.hidden{display:none}.error{color:#a22222}
  </style>
</head>
<body><main>
  <h1>External provider cases</h1>
  <p class="muted">Use your company mailbox account to sign in. Provider conversations are recorded in the company case history and replies are sent to your mailbox.</p>
  <section id="login"><h2>Employee sign in</h2><form id="login-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="login-error" class="error"></p></section>
  <section id="workspace" class="hidden"><div class="row"><h2>Your cases</h2><button id="logout" class="secondary">Sign out</button></div><div id="cases"></div><div id="case-detail"></div></section>
</main>
<script>
let csrfToken="";
let requestedCase=new URLSearchParams(location.search).get("case");
const $=id=>document.getElementById(id);
async function api(path,options={}){const headers={"Content-Type":"application/json",...(options.headers||{})};if(csrfToken)headers["X-CSRF-Token"]=csrfToken;const response=await fetch(path,{credentials:"same-origin",...options,headers});const body=await response.json();if(!response.ok)throw new Error(typeof body.detail==="string"?body.detail:`Request failed (${response.status})`);return body}
function show(authed){$("login").classList.toggle("hidden",authed);$("workspace").classList.toggle("hidden",!authed)}
async function refresh(){const session=await api("/api/session");csrfToken=session.csrf_token||"";show(session.authenticated);if(session.authenticated){await loadCases();if(requestedCase){const id=requestedCase;requestedCase=null;await openCase(id)}}}
async function loadCases(){const result=await api("/api/cases");const root=$("cases");root.replaceChildren();for(const item of result.cases){const button=document.createElement("button");button.className="secondary";button.textContent=item.subject;button.onclick=()=>openCase(item.case_id);root.append(button)}}
function fieldControl(schema,name){let input;if(schema.enum){input=document.createElement("select");for(const value of schema.enum){const option=document.createElement("option");option.value=String(value);option.textContent=String(value);input.append(option)}}else if(schema.type==="boolean"){input=document.createElement("input");input.type="checkbox"}else{input=document.createElement("input");input.type=schema.type==="number"||schema.type==="integer"?"number":"text";if(input.type==="number")input.step=schema.type==="integer"?"1":"any"}input.name=name;input.required=schema.required===true;return input}
async function openCase(id){const item=await api("/api/cases/"+encodeURIComponent(id));const root=$("case-detail");root.replaceChildren();const heading=document.createElement("h2");heading.textContent=item.subject;root.append(heading);const description=document.createElement("p");description.textContent=item.business_description;root.append(description);const outcome=document.createElement("p");outcome.textContent="Requested outcome: "+item.requested_outcome;root.append(outcome);if(item.private_factual_context?.length){const context=document.createElement("section");const title=document.createElement("h3");title.textContent="Customer-provided context";context.append(title);const facts=document.createElement("ul");for(const fact of item.private_factual_context){const row=document.createElement("li");row.textContent=fact.text;facts.append(row)}context.append(facts);root.append(context)}
if(item.account){const account=document.createElement("article");const title=document.createElement("h3");title.textContent=item.account.display_name;account.append(title);const fields=document.createElement("pre");fields.textContent=JSON.stringify(item.account.fields,null,2);account.append(fields);for(const record of item.account.records){const row=document.createElement("details");const summary=document.createElement("summary");summary.textContent=record.display_name;row.append(summary);const data=document.createElement("pre");data.textContent=JSON.stringify(record.fields,null,2);row.append(data);account.append(row)}root.append(account)}
for(const tool of item.forms||[]){const form=document.createElement("form");const title=document.createElement("h3");title.textContent=tool.title;form.append(title);const schema=tool.argument_schema||{};const required=new Set(schema.required||[]);for(const [name,definition] of Object.entries(schema.properties||{})){const label=document.createElement("label");label.textContent=definition.description||definition.title||name.replaceAll("_"," ");const control=fieldControl({...definition,required:required.has(name)},name);label.append(control);form.append(label)}const submit=document.createElement("button");submit.textContent="Submit";form.append(submit);const error=document.createElement("p");error.className="error";form.append(error);const actionId=crypto.randomUUID();form.onsubmit=async event=>{event.preventDefault();submit.disabled=true;const values={};for(const control of form.querySelectorAll("input,select")){values[control.name]=control.type==="checkbox"?control.checked:control.type==="number"?Number(control.value):control.value}try{const receipt=await api("/api/cases/"+encodeURIComponent(id)+"/actions",{method:"POST",body:JSON.stringify({client_action_id:actionId,form_id:tool.source_tool_name,arguments:values})});error.textContent=receipt.status==="applied"?"The provider accepted the customer action.":"The provider declined this action.";await openCase(id)}catch(problem){error.textContent=problem.message;submit.disabled=false}};root.append(form)}
for(const message of item.messages){const row=document.createElement("article");row.className="message";row.textContent=(message.status==="sent"?"Provider reply":"You")+"\n"+message.body;root.append(row);if(message.reply_body){const reply=document.createElement("article");reply.className="message reply";reply.textContent="Provider reply\n"+message.reply_body;root.append(reply)}}const form=document.createElement("form");form.innerHTML='<label>Message to provider<textarea required maxlength="20000"></textarea></label><button>Send message</button><p class="error"></p>';form.onsubmit=async event=>{event.preventDefault();const text=form.querySelector("textarea").value;const button=form.querySelector("button");button.disabled=true;try{await api("/api/cases/"+encodeURIComponent(id)+"/messages",{method:"POST",body:JSON.stringify({client_message_id:crypto.randomUUID(),body:text})});await openCase(id)}catch(error){form.querySelector(".error").textContent=error.message;button.disabled=false}};root.append(form)}
$("login-form").onsubmit=async event=>{event.preventDefault();$("login-error").textContent="";try{const result=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("password").value})});csrfToken=result.csrf_token;$("password").value="";await refresh()}catch(error){$("login-error").textContent=error.message;$("password").value=""}};$("logout").onclick=async()=>{await api("/api/logout",{method:"POST",body:"{}"});csrfToken="";show(false)};refresh().catch(error=>{show(false);$("login-error").textContent=error.message});
</script></body></html>
